version: "3.8"

# Stack: Ollama (local models, GPU) + LiteLLM (OpenAI<->Anthropic proxy) + Open WebUI (UI).
# Deployed on aeacus-dl (Proxmox VM 101, RTX 3060 passthrough). See README.md in this
# directory for the full architecture, the Claude/Anthropic integration, and the GPU
# gotchas (host prerequisites, cgroup driver, persistence mode) that this stack depends on.

services:
  ollama:
    image: ollama/ollama:0.30.10 # pinned: see README.md "Known limits / not yet done"
    container_name: ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    environment:
      # Listen on all interfaces so open-webui/litellm (and other LAN hosts, e.g. Chlio
      # on minos) can reach it, not just localhost inside the container.
      - OLLAMA_HOST=0.0.0.0
      # Keep loaded models resident in VRAM forever. A cold load of a ~6-7GB model takes
      # ~4 minutes (models load with --no-mmap, i.e. a full read into RAM first) — the
      # default 5m keep-alive means any gap in traffic longer than 5 minutes pays that
      # cost again on the next request. -1 = never unload.
      - OLLAMA_KEEP_ALIVE=-1
      # Skip the Vulkan backend probe at startup. GPU discovery runs each backend probe under
      # a 30s watchdog and this VM's disk is slow (shared HDD); every probe we skip is one
      # less chance to time out and fall back to CPU. CUDA is what we use. (2026-11-21)
      - OLLAMA_VULKAN=0
      # Default is 4096 on GPUs <24 GiB VRAM. Web search results + tool schemas overflow 4k
      # and Ollama truncates the prompt silently. 16k fits qwen3.5:9b fully in the 3060's
      # 12 GB; 14B models at 16k are tight — lower per-model num_ctx in Open WebUI if needed.
      - OLLAMA_CONTEXT_LENGTH=16384
      # Default 5m is shorter than a cold model load from this VM's slow shared HDD (3-6 min
      # measured), so switching to a not-yet-loaded model failed with "timed out waiting for
      # llama-server to start" (seen with gemma4, 2026-11-21).
      - OLLAMA_LOAD_TIMEOUT=15m
      # Flash attention + 8-bit KV cache roughly halve the VRAM a long context costs, so a 12-14B
      # model (Q4) can stay fully on the 3060's 12 GB at 16-24k context instead of spilling to
      # system RAM (a 14B spilled and swapped the whole host on 2026-11-23). Quality loss from
      # q8_0 KV is negligible in practice. (2026-11-23, see docs/changelog agent_model_benchmark)
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    restart: always
    ports:
      - "4000:4000"
    env_file:
      - .env
    volumes:
      - ./litellm-config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000"]

  open-webui:
    # Pinned (2026-11-21). Was the floating :main tag (resolved to 0.6.41). Upgrades run one-way
    # DB migrations: back up the open-webui volume first (see README "Upgrading").
    image: ghcr.io/open-webui/open-webui:v0.13.4
    container_name: open-webui
    depends_on:
      - ollama
      - litellm
      - mcp-tools
    restart: always
    ports:
      # LAN + tailnet access on :3005 (owner's choice, 2026-11-21: briefly loopback/Tailscale-
      # only, then reverted). Also served as HTTPS on https://aeacus-dl.tailaee7b8.ts.net via
      # `tailscale serve --https=443` -> 127.0.0.1:3005. See README "Access".
      - "3005:8080"
    environment:
      # Container-to-container DNS name, not localhost/an external IP.
      - OLLAMA_HOST=http://ollama:11434
      # Stable JWT signing key. Without it Open WebUI generates one inside the container
      # filesystem (not the volume), so every container recreate logged everyone out.
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:?set WEBUI_SECRET_KEY in .env}
      - WEBUI_URL=https://aeacus-dl.tailaee7b8.ts.net
      # --- Memory + cross-chat reference (0.7.0+) -----------------------------------------
      # With Function Calling = Native (default since 0.10), models get built-in tools
      # add_memory/search_memories/update_memory and search_chats/view_chat. Background review
      # additionally distils new memories from the conversation every N turns on its own.
      - ENABLE_MEMORIES=true
      - ENABLE_MEMORY_BACKGROUND_REVIEW=true
      - MEMORIES_REVIEW_INTERVAL_TURNS=6
      # --- Web search: Exa (2026-11-21, replaced the short-lived SearXNG setup) -----------
      # PersistentConfig: env only seeds these while the DB has no value. Once changed in
      # Admin -> Settings -> Web Search, the DB wins and these lines are ignored.
      - ENABLE_WEB_SEARCH=true
      - WEB_SEARCH_ENGINE=exa
      - EXA_API_KEY=${EXA_API_KEY:?set EXA_API_KEY in .env}
      - WEB_SEARCH_RESULT_COUNT=5
      - WEB_SEARCH_CONCURRENT_REQUESTS=5
      # --- MCP tool server (PersistentConfig too) ----------------------------------------
      # NOTE (2026-11-21): this env only SEEDED the list. The DB copy is now authoritative and
      # also holds the 4 Google Workspace MCP servers (added by google-mcp/connect_google_mcp.py,
      # incl. the OAuth client secret, which must not live in this file). Editing this line has
      # no effect unless the DB value is cleared.
      # auth_type=session: Open WebUI forwards the logged-in user's own JWT; mcp-tools
      # verifies it against /api/v1/auths/ on every request (see mcp-tools/server.py).
      # Default 10s. Open WebUI 0.13's MCP SDK 2.x first probes `server/discover` (new
      # stateless protocol); mcp-tools (SDK 1.30) rejects it and the client falls back to the
      # legacy initialize handshake. Under heavy disk I/O (e.g. a cold model load) probe +
      # fallback exceeded 10s -> "Failed to connect to MCP server 'homelab'" (2026-11-21).
      # 2026-11-24: lowered 30 -> 8. At 30 s one dead MCP server stalled every tool-using chat
      # request (Claude models too) for up to 30 s. mcp-healthcheck now switches dead servers
      # off, and this bounds the cost in the ~1.5 min before it does. Not lower than 8: the
      # 2026-11-21 failure above needed >10 s only under heavy disk I/O, so 8 trades a rare
      # false "Failed to connect" during a cold model load for a 4x shorter stall.
      - MCP_INITIALIZE_TIMEOUT=8
      - 'TOOL_SERVER_CONNECTIONS=[{"type":"mcp","url":"http://mcp-tools:8000/mcp","path":"","auth_type":"session","key":"","config":{"enable":true},"info":{"id":"homelab","name":"Homelab Tools","description":"Sandboxed shell/python, LlamaParse document extraction, scrape.do search/fetch, publish files to s3.ereuna.org"}}]'
    volumes:
      - open-webui:/app/backend/data
    networks:
      - default
      # Shared ONLY with google-workspace-mcp, so nothing else (notably mcp-tools' sandbox,
      # which has internet access) can reach the server that holds the Google refresh token.
      - gws
      # Shared ONLY with clickhouse-mcp (same idea as gws): nothing else can reach it.
      - chmcp
      - dgmcp
      - ghmcp
      - gtmcp

  # Google Workspace MCP (Drive/Docs/Sheets/Slides read-only + Calendar read/write, via the regular Google REST APIs).
  # Single-user: holds ONE Google account's refresh token (credentials volume). The /mcp
  # endpoint has no auth of its own, so isolation is by network: it is attached only to the
  # `gws` network (open-webui is the only other member) and publishes only 127.0.0.1:8001, which
  # `tailscale serve` exposes for the single path /oauth2callback (Google redirect after consent).
  google-workspace-mcp:
    build: ./google-workspace-mcp
    image: homelab/google-workspace-mcp:2.6.0
    container_name: google-workspace-mcp
    restart: always
    # --tool-tier core: the "complete" read-only set was 23 tools / ~9.2k tokens of schema sent
    # with EVERY request (all tools are default-on for all models) -> overflows the 16k-context
    # local models. Core keeps search/list/read for each service.
    # 2026-11-22: Calendar is read/write (list_calendars, get_events, manage_event = create/update/delete),
    # everything else stays read-only. --permissions replaces --read-only/--tools (mutually exclusive) and
    # requests only the scopes each level needs: Drive/Docs/Sheets/Slides read-only, Calendar full.
    # 2026-11-22: + Gmail READ and DRAFTS (no sending). "gmail:readonly+drafts" grants only the readonly and drafts scopes (gmail.readonly +
    # gmail.compose; no labels/modify/settings). Google has no drafts-only scope and gmail.compose can technically send, so sending is also
    # blocked in the server (--disabled-tools). draft_gmail_message lives in the "extended" tier, hence --tool-tier extended; that registers
    # extra tools for the other services too, so Open WebUI exposes each connection through an allow-list (function_name_filter_list):
    # `gworkspace` = the original 10 tools, `gmail` = the 7 Gmail read/draft tools (see README "Gmail").
    command: ["--transport", "streamable-http", "--single-user",
              "--tool-tier", "extended",
              "--permissions", "drive:readonly", "docs:readonly", "sheets:readonly", "slides:readonly", "calendar:full", "gmail:readonly+drafts",
              "--disabled-tools", "send_gmail_message", "manage_gmail_filter", "manage_gmail_label", "modify_gmail_message_labels",
              "batch_modify_gmail_message_labels"]
    environment:
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:?set GOOGLE_OAUTH_CLIENT_ID in .env}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:?set GOOGLE_OAUTH_CLIENT_SECRET in .env}
      - USER_GOOGLE_EMAIL=${GOOGLE_WORKSPACE_USER_EMAIL:?set GOOGLE_WORKSPACE_USER_EMAIL in .env}
      - WORKSPACE_MCP_PORT=8000
      # Default binds 127.0.0.1 inside the container (unreachable from open-webui and from the
      # published port). 0.0.0.0 here is still only reachable via the gws network + 127.0.0.1:8001.
      - WORKSPACE_MCP_HOST=0.0.0.0
      - WORKSPACE_MCP_BASE_URI=http://google-workspace-mcp
      # Browser-facing callback (must also be an Authorized redirect URI on the Google client).
      - GOOGLE_OAUTH_REDIRECT_URI=https://aeacus-dl.tailaee7b8.ts.net/oauth2callback
      - WORKSPACE_EXTERNAL_URL=https://aeacus-dl.tailaee7b8.ts.net
      # TLS terminates at tailscale serve; the last hop to this container is plain HTTP, which
      # oauthlib refuses without this flag. The browser<->server leg is HTTPS.
      - OAUTHLIB_INSECURE_TRANSPORT=1
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - gws-data:/data
    networks:
      - gws
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:size=256m", "/home/gws:size=64m,uid=10001,gid=10001"]
    mem_limit: 1g
    pids_limit: 256
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ClickHouse MCP (list_databases / list_tables / run_query) over ClickHouse's HTTP interface (8123/8443,
  # NOT native 9000). Installed 2026-11-22 WITHOUT a ClickHouse target: set CLICKHOUSE_HOST/_USER/_PASSWORD
  # (and _PORT/_SECURE/_VERIFY) in .env, then `docker compose up -d clickhouse-mcp`. Until then tool calls
  # return "Missing required environment variables". Read-only: writes are not enabled here on purpose.
  # Isolation: only the `chmcp` network (open-webui is the only other member), no published port, and a
  # mandatory bearer token (Open WebUI sends it; see clickhouse-mcp/register_in_openwebui.py).
  clickhouse-mcp:
    build: ./clickhouse-mcp
    image: homelab/clickhouse-mcp:0.7.0
    container_name: clickhouse-mcp
    restart: always
    environment:
      - CLICKHOUSE_MCP_AUTH_TOKEN=${CLICKHOUSE_MCP_AUTH_TOKEN:?set CLICKHOUSE_MCP_AUTH_TOKEN in .env (openssl rand -hex 32)}
      # Host header Open WebUI uses to reach this container; anything else is rejected (421).
      - CLICKHOUSE_MCP_ALLOWED_HOSTS=clickhouse-mcp:8000,clickhouse-mcp
      - CLICKHOUSE_MCP_QUERY_TIMEOUT=${CLICKHOUSE_MCP_QUERY_TIMEOUT:-30}
      - CLICKHOUSE_MCP_MAX_WORKERS=4
      # --- the ClickHouse target (empty until you configure it) ---
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST:-}
      - CLICKHOUSE_PORT=${CLICKHOUSE_PORT:-8123}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DATABASE:-}
      - CLICKHOUSE_SECURE=${CLICKHOUSE_SECURE:-false}
      - CLICKHOUSE_VERIFY=${CLICKHOUSE_VERIFY:-true}
      # Read-only on purpose (server-side readonly=1). Do not enable without a dedicated, tightly granted user.
      - CLICKHOUSE_ALLOW_WRITE_ACCESS=false
      - CLICKHOUSE_ALLOW_DROP=false
    networks:
      - chmcp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:size=64m", "/home/chmcp:size=16m,uid=10002,gid=10002"]
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      # TCP only: /health returns 503 while no ClickHouse is configured/reachable, which must not mark the MCP itself down.
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Dagster MCP (runs, assets, jobs, schedules, sensors, backfills, code locations) over Dagster's GraphQL API.
  # Installed 2026-11-22 WITHOUT a Dagster target: set DAGSTER_URL (and DAGSTER_API_TOKEN if the webserver needs one)
  # in .env, then `docker compose up -d dagster-mcp`. Until then tool calls fail with a connection error to
  # localhost:3000. READ-ONLY: DAGSTER_READ_ONLY=true means the launch/terminate/backfill/schedule/sensor tools are
  # never registered. Community package pinned + sha256-checked at build (dagster-mcp/Dockerfile).
  # Isolation: only the `dgmcp` network (open-webui is the only other member), no published port, mandatory bearer token.
  dagster-mcp:
    build: ./dagster-mcp
    image: homelab/dagster-mcp:0.12.3
    container_name: dagster-mcp
    restart: always
    environment:
      - DAGSTER_MCP_AUTH_TOKEN=${DAGSTER_MCP_AUTH_TOKEN:?set DAGSTER_MCP_AUTH_TOKEN in .env (openssl rand -hex 32)}
      - DAGSTER_MCP_ALLOWED_HOSTS=dagster-mcp:8000,dagster-mcp
      # --- the Dagster target (placeholder until you configure it) ---
      - DAGSTER_URL=${DAGSTER_URL:-http://localhost:3000}
      - DAGSTER_API_TOKEN=${DAGSTER_API_TOKEN:-}
      # Several instances (e.g. one Dagster per Maia warehouse): JSON like {"wh1":{"url":"http://...:3000"},"wh2":{...}}
      - DAGSTER_ENVS=${DAGSTER_ENVS:-}
      - DAGSTER_DEFAULT_ENV=${DAGSTER_DEFAULT_ENV:-}
      - DAGSTER_READ_ONLY=true
    networks:
      - dgmcp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:size=64m", "/home/dgmcp:size=16m,uid=10003,gid=10003"]
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # GitHub MCP (official github/github-mcp-server v2.2.0), HTTP mode, READ-ONLY. Stateless credential passthrough: this container holds NO
  # token; Open WebUI sends the user's GitHub token as `Authorization: Bearer` (the connection key, see README "GitHub and Gitea MCP").
  # The full tool list is ~18k tokens, so Open WebUI exposes a 13-tool allow-list (git-mcp/register_in_openwebui.py). Image pinned by digest.
  github-mcp:
    image: ghcr.io/github/github-mcp-server@sha256:040c4e99810076035eb1d9beb4b4a96fcf589c43cefed6ff51a46a553eb4e174   # v2.2.0, 2026-11-16
    container_name: github-mcp
    restart: always
    user: "65532:65532"
    command: ["http", "--port", "8082", "--read-only", "--toolsets", "context,repos,issues,pull_requests",
              "--exclude-tools", "ui_get,list_issue_fields,list_issue_types"]
    networks:
      - ghmcp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:size=32m"]
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Gitea MCP (official gitea.com/gitea/gitea-mcp), HTTP mode, READ-ONLY, pointed at the Gitea app on TrueNAS (Tailscale IP, port 30008,
  # Gitea 1.25.5). Stateless credential passthrough: no token in this container; Open WebUI sends a Gitea access token (read-only scopes,
  # name "open-webui-mcp", user aeacus) as `Authorization: Bearer`. Image pinned by digest.
  gitea-mcp:
    image: docker.gitea.com/gitea-mcp-server@sha256:2daf12dfa853bfc21f6f4754bca2612957c2acbc4288b03ddcce81e37f18ea18   # 2026-11-06
    container_name: gitea-mcp
    restart: always
    command: ["/app/gitea-mcp", "-t", "http", "-p", "8080", "-H", "http://100.100.133.10:30008", "-r"]
    environment:
      - GITEA_READONLY=true
    networks:
      - gtmcp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:size=32m"]
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # MCP tool server (our own code, ./mcp-tools). Reachable ONLY from containers on this
  # compose network — no `ports:` on purpose — and every request must carry a valid Open
  # WebUI session token. Commands run as per-user unprivileged UIDs inside this container.
  mcp-tools:
    build: ./mcp-tools
    image: homelab/mcp-tools:local
    container_name: mcp-tools
    restart: always
    environment:
      - OPENWEBUI_URL=http://open-webui:8080
      - EXEC_ALLOWED_ROLES=admin
      - LLAMA_CLOUD_API_KEY=${LLAMA_CLOUD_API_KEY:?set LLAMA_CLOUD_API_KEY in .env}
      - SCRAPEDO_TOKEN=${SCRAPEDO_TOKEN:?set SCRAPEDO_TOKEN in .env}
      - S3_ENDPOINT=s3.ereuna.org
      - S3_SECURE=true
      - S3_BUCKET=openwebui-files
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      - S3_SECRET_KEY=${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      - PRESIGN_DEFAULT_HOURS=24
    volumes:
      - mcp-workspace:/workspace
    # Least privilege: root in the container only to switch to per-user UIDs.
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER, KILL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:size=512m"]
    mem_limit: 4g
    cpus: 4
    pids_limit: 512
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  # Switches dead tool servers off in Open WebUI and back on when they recover (see
  # mcp-healthcheck/healthcheck.py). Probes go THROUGH Open WebUI's verify endpoint, so this
  # container needs only the default network (not gws/chmcp/dgmcp/ghmcp/gtmcp). It holds
  # WEBUI_SECRET_KEY to mint a 2-minute admin token, hence the lockdown. OWUI_ADMIN_ID is the
  # admin user's id (not a secret): select id from user where role='admin' order by created_at limit 1
  mcp-healthcheck:
    image: python:3.12-slim-bookworm
    container_name: mcp-healthcheck
    restart: always
    depends_on:
      - open-webui
    command: ["python", "-u", "/app/healthcheck.py"]
    environment:
      - OWUI_URL=http://open-webui:8080
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:?set WEBUI_SECRET_KEY in .env}
      - OWUI_ADMIN_ID=${OWUI_ADMIN_ID:?set OWUI_ADMIN_ID in .env (admin user id from Open WebUI)}
      - CHECK_INTERVAL=45
      - FAILS_TO_DISABLE=2
      - OKS_TO_ENABLE=2
      - DRY_RUN=${MCP_HEALTHCHECK_DRY_RUN:-false}
    volumes:
      - ./mcp-healthcheck/healthcheck.py:/app/healthcheck.py:ro
    healthcheck:
      # Heartbeat is written after every completed cycle; stale = loop stuck or Open WebUI down.
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/heartbeat')<300 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    read_only: true
    tmpfs: ["/tmp:size=1m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  ollama:
  open-webui:
  mcp-workspace:
  gws-data:

networks:
  default: {}
  gws: {}
  chmcp: {}
  dgmcp: {}
  ghmcp: {}
  gtmcp: {}
