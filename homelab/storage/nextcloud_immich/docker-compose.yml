name: friend-selfhost

services:
  # ---------------- Immich (photos) ----------------
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v2}
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      # 0.0.0.0 = reachable on every interface (localhost, LAN, Tailscale)
      - "0.0.0.0:2283:2283"
    depends_on:
      - immich-redis
      - immich-database
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v2}
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false

  immich-redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:8
    restart: always
    healthcheck:
      test: redis-cli ping || exit 1

  immich-database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    restart: always

  # ---------------- Nextcloud (files) ----------------
  nextcloud:
    container_name: nextcloud_app
    image: nextcloud:31-apache
    ports:
      - "0.0.0.0:8080:80"
    volumes:
      - ${NEXTCLOUD_DATA_LOCATION}:/var/www/html
    environment:
      MYSQL_HOST: nextcloud-db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      REDIS_HOST: nextcloud-redis
      # Space-separated list of hosts Nextcloud will answer on (set in .env).
      # NOTE: only applied on FIRST install — see occ command in comments below.
      NEXTCLOUD_TRUSTED_DOMAINS: ${TRUSTED_DOMAINS}
    depends_on:
      - nextcloud-db
      - nextcloud-redis
    restart: always

  nextcloud-db:
    container_name: nextcloud_db
    image: mariadb:11.4
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    environment:
      MYSQL_ROOT_PASSWORD: ${NEXTCLOUD_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
    volumes:
      - nextcloud-db-data:/var/lib/mysql
    restart: always

  nextcloud-redis:
    container_name: nextcloud_redis
    image: redis:7-alpine
    restart: always

volumes:
  model-cache:
  nextcloud-db-data: