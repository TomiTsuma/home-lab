services:
  fruitdeeplinks:
    build:
      context: ../FruidDeepLinks_Source
      dockerfile: Dockerfile
    image: fruitdeeplinks:local
    container_name: fruitdeeplinks
    restart: unless-stopped
    networks:
      - sports-net
    ports:
      - "${STREAM_BIND_IP:-127.0.0.1}:${FRUIT_HOST_PORT:-30080}:6655"
    volumes:
      - ./FruitDeepLinks/data:/app/data
      - ./FruitDeepLinks/out:/app/out
      - ./FruitDeepLinks/logs:/app/logs
    environment:
      TZ: ${TZ:-Asia/Kuala_Lumpur}
      SERVER_URL: ${FRUIT_SERVER_URL:-http://localhost:30080}
      FRUIT_HOST_PORT: ${FRUIT_HOST_PORT:-30080 }
      FRUIT_DB_PATH: /app/data/fruit_events.db
      OUT_DIR: /app/out
      LOG_DIR: /app/logs

  dvarr:
    build:
      context: ../DVarr_Source
      dockerfile: Dockerfile
    image: dvarr:local
    container_name: dvarr
    restart: unless-stopped
    networks:
      - sports-net
    ports:
      - "${STREAM_BIND_IP:-127.0.0.1}:8686:1867"
    volumes:
      - ./DVarr/config:/config
      - ./DVarr/media:/media
      - ./DVarr/segments:/segments
    environment:
      TZ: ${TZ:-Asia/Kuala_Lumpur}
      DVARR_AUTH_USER: ${DVARR_AUTH_USER:?Set DVARR_AUTH_USER in stream/.env}
      DVARR_AUTH_PASS: ${DVARR_AUTH_PASS:?Set DVARR_AUTH_PASS in stream/.env}
      DVARR_TSDB_API_KEY: ${DVARR_TSDB_API_KEY:-}

  stream-proxy:
    build: ./proxy
    container_name: stream_header_proxy
    restart: unless-stopped
    networks:
      - sports-net
    ports:
      - "${STREAM_BIND_IP:-127.0.0.1}:5050:5050"
    environment:
      PROXY_ALLOWED_HOSTS: ${PROXY_ALLOWED_HOSTS:?Set PROXY_ALLOWED_HOSTS in stream/.env}

  nba-go:
    image: node:18-alpine
    container_name: nba_cli_dashboard
    entrypoint: ["sh", "-c", "npm install -g nba-go && tail -f /dev/null"]
    networks:
      - sports-net
    restart: unless-stopped

networks:
  sports-net:
    driver: bridge
