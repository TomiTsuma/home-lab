version: '3.8'

services:
  gotify:
    image: gotify/server:latest
    container_name: gotify
    restart: always
    ports:
      - "8181:80"
    environment:
      - GOTIFY_SERVER_PORT=80
      # Optional: Set the server timezone
      - TZ=Asia/Kuala_Lumpur
    volumes:
      # Persists data to a local 'gotify_data' directory in the same folder
      - ./gotify_data:/app/data
