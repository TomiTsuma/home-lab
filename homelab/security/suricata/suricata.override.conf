# /etc/systemd/system/suricata.service.d/override.conf
# pve has very little free RAM (VMs are allocated more than the host has). Hard-cap Suricata so that if
# it ever grows, the kernel kills *Suricata* instead of the host swapping VM memory, which is what
# caused the 2026-11-23 Aether outage. systemd restarts it after a kill.
[Service]
MemoryHigh=600M
MemoryMax=800M
MemorySwapMax=0
Nice=10
CPUWeight=20
IOWeight=20
Restart=on-failure
RestartSec=30s
# GRO on the physical NIC merges packets into 64 KB super-frames, which Suricata sees as "truncated
# packet" and can't inspect. Turn it off for the capture. Small CPU cost at home-internet speeds.
ExecStartPre=-/usr/sbin/ethtool -K enp0s31f6 gro off
